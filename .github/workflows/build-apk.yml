name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "FotoFinals-v${{ steps.version.outputs.version }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FotoFinals-v${{ steps.version.outputs.version }}-debug-apk
          path: FotoFinals-v${{ steps.version.outputs.version }}-debug.apk
